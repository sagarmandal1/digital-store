<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Digital Store CRM</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div class="wrap">
    <!-- Header -->
    <div class="header">
      <div class="header-top">
        <div class="brand">
          <div class="logo-box">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
              <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
          </div>
          <div>
            <div class="title">Digital Store</div>
            <div class="subtitle">WhatsApp CRM Assistant</div>
          </div>
        </div>
        <span class="version-tag">v2.1.0</span>
      </div>
    </div>

    <div class="content">
      <!-- Live Connection Status Card -->
      <div class="overview-card" id="connectionCard">
        <div class="overview-header">
          <div class="overview-label">Server Connection</div>
          <span class="status-indicator" id="statusDot"></span>
        </div>
        <div id="connectionState" class="overview-value">Checking...</div>
        <div id="connectionMeta" class="overview-meta">Connecting to your Digital Store server</div>
      </div>

      <!-- Connected Profile (Hidden by default) -->
      <div id="profileCard" class="profile-card ds-hidden">
        <div class="profile-avatar" id="profileAvatar">DS</div>
        <div class="profile-info">
          <div id="profileName" class="profile-name">-</div>
          <div id="profileScope" class="profile-scope">-</div>
        </div>
      </div>

      <!-- WhatsApp Quick Action Controls -->
      <div class="section-title">WhatsApp Controls</div>
      <div class="controls-grid">
        <button id="openPanel" class="btn-action primary">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <span>Open Panel</span>
        </button>
        <button id="refreshPanel" class="btn-action">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
          <span>Sync Data</span>
        </button>
      </div>

      <!-- Quick Shortcuts Grid -->
      <div class="section-title">Quick Shortcuts</div>
      <div class="shortcuts-grid">
        <button id="openAdminPanel" class="btn-shortcut" title="Open Admin Dashboard">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          <span>Admin</span>
        </button>
        <button id="openSales" class="btn-shortcut" title="Open Sales Page">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
          <span>Sales</span>
        </button>
        <button id="openDues" class="btn-shortcut" title="Open Dues List">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 14 14"/></svg>
          <span>Dues</span>
        </button>
        <button id="openSite" class="btn-shortcut" title="Open Settings">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <span>Settings</span>
        </button>
      </div>

      <!-- Settings Accordion / Form -->
      <div class="settings-box">
        <div class="section-title" style="margin-top: 6px;">Server Configuration</div>

        <div class="field">
          <label>Website URL</label>
          <div class="input-wrap">
            <input id="baseUrl" placeholder="https://digital-store.top" spellcheck="false">
          </div>
        </div>

        <div class="field">
          <label>API Token</label>
          <div class="input-wrap">
            <input id="token" type="password" placeholder="Paste API token from Settings" spellcheck="false">
          </div>
        </div>

        <div class="field">
          <label>Scope Admin ID <span class="label-opt">(Super admin only)</span></label>
          <div class="input-wrap">
            <input id="scopeAdminId" placeholder="e.g. 2 (Leave blank for default)" spellcheck="false">
          </div>
        </div>

        <div class="actions">
          <button id="save" class="btn-primary">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
            Save Settings
          </button>
          <button id="test" class="btn-secondary">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
            Test
          </button>
        </div>
      </div>

      <div id="status" class="status-box"></div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>

</html>
